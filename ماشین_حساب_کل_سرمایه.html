<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ماشین حساب کل سرمایه</title><style>body{font-family:Tahoma;background:linear-gradient(135deg,#eef4ff,#f5efff);padding:16px}.app{max-width:620px;margin:auto;background:white;padding:20px;border-radius:20px;box-shadow:0 8px 30px #0001}input,button{width:100%;box-sizing:border-box;padding:12px;margin:7px 0;border-radius:11px;font-size:17px;border:1px solid #c7d2fe}button{background:#2563eb;color:white;border:0;font-weight:bold}.card{margin-top:12px;padding:14px;background:#f8f8ff;border-radius:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.item{background:white;padding:9px;border-radius:10px;border:1px solid #e4e4e7}.item span{font-size:12px;color:#71717a}.item b{display:block;margin-top:4px}.total{text-align:center;font-size:28px;font-weight:900;color:#4338ca}.gray{background:#e8e7f3;color:#3730a3}</style><div class=app><h1>ماشین حساب کل سرمایه</h1><p>ارزش تتر + تومان اتاق + تومان بانک = کل سرمایه</p><label>مقدار تتر</label><input id=u type=number min=0 step=any placeholder="مثلاً ۵۰۰۰"><label>نرخ هر تتر به تومان</label><input id=r type=number min=0 step=any placeholder="مثلاً ۱۱۰۰۰۰"><label>تومان داخل اتاق</label><input id=o type=number min=0 placeholder="مثلاً ۲۰۰۰۰۰۰۰۰"><label>تومان داخل بانک‌ها</label><input id=b type=number min=0 placeholder="مثلاً ۳۰۰۰۰۰۰۰۰"><div class=card><div class=grid><div class=item><span>ارزش تتر</span><b id=tv>۰ تومان</b></div><div class=item><span>اتاق</span><b id=ov>۰ تومان</b></div><div class=item><span>بانک</span><b id=bv>۰ تومان</b></div><div class=item><span>مقدار تتر</span><b id=uv>۰</b></div></div><hr><div>کل سرمایه</div><div class=total id=t>۰ تومان</div></div><button onclick=save()>💾 ذخیره</button><button class=gray onclick=clr()>پاک کردن</button></div><script>let ids=['u','r','o','b'],n=x=>Number(x.value)||0,f=x=>new Intl.NumberFormat('fa-IR').format(Math.round(x))+' تومان';function up(){let u=n(U),r=n(R),o=n(O),b=n(B),v=u*r;tv.textContent=f(v);ov.textContent=f(o);bv.textContent=f(b);uv.textContent=new Intl.NumberFormat('fa-IR').format(u);t.textContent=f(v+o+b)}let U=u,R=r,O=o,B=b;ids.forEach(x=>document.getElementById(x).addEventListener('input',up));function save(){let d={};ids.forEach(x=>d[x]=document.getElementById(x).value);localStorage.capital=JSON.stringify(d);alert('ذخیره شد')}function clr(){ids.forEach(x=>document.getElementById(x).value='');localStorage.removeItem('capital');up()}try{let d=JSON.parse(localStorage.capital||'null');if(d)ids.forEach(x=>document.getElementById(x).value=d[x]||'')}catch(e){}up()</script></html>
